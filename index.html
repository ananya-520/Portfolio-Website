document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nology Innovation Institute (TII)<\u002Fspan><span style=\"font-size: 13.5px; color: #7a6b5f;\">Autonomous Robotics Research Center (ARRC) · Abu Dhabi<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin: 0 0 22px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px;\">\n              <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.62; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Developing a modular Python robotics pipeline for forward and inverse kinematics, Jacobians, workspace reachability and singularity analysis.<\u002Fli>\n              <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.62; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Integrated URDF parsing, Pinocchio kinematics, MuJoCo simulation and CAD models so that geometry, coordinate frames and joints stay consistent across tools.<\u002Fli>\n              <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.62; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Built an interactive simulation dashboard that parses URDF parameters and updates kinematics live from user inputs.<\u002Fli>\n              <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.62; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Evaluated bilinear, biquadratic, Gaussian-process and neural-network approximation models for workspace analysis, with error visualisation.<\u002Fli>\n            <\u002Ful>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Python<\u002Fspan>\n o', ui-monospace, monospace; font-size: 11.5px; color: #7a6b5f; white-space: nowrap;\">Aug 2025 – Sep 2025<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0 0 6px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.1; color: #2a211c;\">Digital Transformation Intern<\u002Fh3>\n            <div style=\"margin-bottom: 22px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; line-height: 1.4;\"><span style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.005em; color: #8c0a28;\">International Development Company (IDC) Tech<\u002Fspan><span style=\"font-size: 13.5px; color: #7a6b5f;\">Industrial automation &amp; IT/OT<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin: 0 0 22px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px;\">\n              <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.62; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Worked with industrial automation and IT/OT systems, including DCS, PLC, SCADA, OPC, industrial Ethernet, VLANs, firewalls and OT security.<\u002Fli>\n              <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.62; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Supported Factory Acceptance Test documentation, DCS server monitoring, VM health checks, NTP configuration and network architecture.<\u002Fli>\n              <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.62; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Worked with Cognite Data Fusion, Power BI and Cognite InField; earned Cognite Domain Expert and InField Practitioner certifications.<\u002Fli>\n              <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.62; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Developed a C# VSTO Outlook email summariser with AI/NLP and a K-Means file-segregation workflow.<\u002Fli>\n            <\u002Ful>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">DCS / SCADA<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">OT security<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Cognite<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">C# · NLP<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-sec=\"projects\" id=\"projects\" data-screen-label=\"Projects\" style=\"position: relative; padding: 110px 0;\">\n      <div data-line=\"\" style=\"position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(140,10,40,0.35) 20%, rgba(70,48,36,0.18) 80%, transparent); transform: scaleX(0); transform-origin: left center; transition: transform 1.4s cubic-bezier(.7,0,.2,1);\"><\u002Fdiv>\n      <div data-reveal=\"0\" style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 52px;\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 16px; margin-bottom: 22px;\">\n            <span style=\"display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8c0a28;\"><span style=\"width: 28px; height: 2px; border-radius: 2px; background: #8c0a28;\"><\u002Fspan>Projects<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(38px, 4.4vw, 62px); line-height: 1; letter-spacing: -0.01em; color: #2a211c;\">Selected <span style=\"font-style: italic; color: #8c0a28;\">work<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0; max-width: 380px; font-size: 15px; line-height: 1.62; color: #6b5d52;\">A mix of hardware, firmware and machine learning work, from coursework to competition builds.<\u002Fp>\n      <\u002Fdiv>\n\n      <article data-reveal=\"1\" data-card=\"\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 0; margin-bottom: 22px; border-radius: 28px; overflow: hidden; border: 1px solid rgba(70,48,36,0.11); background: #fbf7f0; box-shadow: 0 40px 80px -56px rgba(70,48,36,0.55); transition: transform 0.45s cubic-bezier(.2,.8,.2,1);\">\n        <div style=\"position: relative; min-height: 380px;\">\n          <image-slot id=\"proj-ascend\" shape=\"rect\" placeholder=\"Drop a photo of ASCEND-R\" src=\"a7eb5b4f-31af-4fd6-80bd-6f613f3779ab\"><\u002Fimage-slot>\n          <div style=\"position: absolute; top: 18px; left: 18px; padding: 7px 13px; border-radius: 999px; background: #8c0a28; color: #fbf7f0; font-size: 12px; font-weight: 500; pointer-events: none; white-space: nowrap;\">Featured project<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: clamp(28px, 3.4vw, 46px);\">\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 16px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;\">\n            <span style=\"color: #8c0a28;\">Assistive robotics<\u002Fspan>\n            <span style=\"color: #7a6b5f;\">Jan – Jun 2026<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0 0 12px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(30px, 3vw, 44px); line-height: 1.04; color: #2a211c;\">ASCEND-R<span style=\"display: block; font-style: italic; color: #8c0a28;\">Smart Safety Walker<\u002Fspan><\u002Fh3>\n          <p style=\"margin: 0 0 24px; font-size: 15px; line-height: 1.66; color: #5a4c42; text-wrap: pretty;\">Embedded firmware, safety logic and sensor/actuator integration for a walker that detects falls, locks its brakes and adjusts its height. It also has a live WiFi dashboard and voice control.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(110px, 100%), 1fr)); gap: 1px; margin-bottom: 24px; border-radius: 16px; overflow: hidden; background: rgba(70,48,36,0.1); border: 1px solid rgba(70,48,36,0.1);\">\n            <div style=\"padding: 14px 16px; background: #f8f2e8;\"><div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1; color: #2a211c;\" data-count=\"500\" data-suffix=\" Hz\">500 Hz<\u002Fdiv><div style=\"margin-top: 6px; font-size: 11.5px; color: #7a6b5f;\">IMU &amp; fall loop<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding: 14px 16px; background: #f8f2e8;\"><div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1; color: #2a211c;\" data-count=\"350\" data-prefix=\"~\" data-suffix=\" ms\">~350 ms<\u002Fdiv><div style=\"margin-top: 6px; font-size: 11.5px; color: #7a6b5f;\">Braking window<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding: 14px 16px; background: #f8f2e8;\"><div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1; color: #2a211c;\" data-count=\"80\" data-suffix=\" kg\">80 kg<\u002Fdiv><div style=\"margin-top: 6px; font-size: 11.5px; color: #7a6b5f;\">Support capacity<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <ul style=\"margin: 0 0 24px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 11px;\">\n            <li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.6; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Teensy 4.1 firmware in C++ running three non-blocking control loops at 500, 50 and 10 Hz.<\u002Fli>\n            <li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.6; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Safety state machine (IDLE → WALKING → EMERGENCY / FAULT) with a user-intent classifier and hardware watchdog.<\u002Fli>\n            <li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.6; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>ESP32 WebSocket dashboard, INT8 TensorFlow Lite model via Edge Impulse, and \"hey_ascend\" voice wake word.<\u002Fli>\n            <li style=\"display: flex; gap: 12px; font-size: 14px; line-height: 1.6; color: #5a4c42;\"><span style=\"flex: none; margin-top: 9px; width: 10px; height: 1px; background: #8c0a28;\"><\u002Fspan>Validated in Gazebo, hardware-in-the-loop and bench tests.<\u002Fli>\n          <\u002Ful>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n            <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">C++<\u002Fspan>\n            <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Teensy 4.1<\u002Fspan>\n            <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">ESP32<\u002Fspan>\n            <span st gramming for a proof-of-concept exoskeleton using Teensy 4.1 and ESP32 controllers, IMUs, and an actuator driven by Field-Oriented Control over CAN.<\u002Fp>\n            <div style=\"margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px;\">\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">FOC<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">CAN<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">IMUs<\u002Fspan>\n            <\u002Fdiv>\n            <a href=\"https://auxilium-robotics.vercel.app/\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(70,48,36,0.12); font-size: 13.5px; font-weight: 600; color: #8c0a28; transition: color 0.25s, padding 0.25s;\" style-hover=\"color: #a30d2f; padding-left: 4px;\"><span>View project<\u002Fspan><span>↗<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article data-card=\"\" style=\"flex: 0 0 min(340px, 82vw); scroll-snap-align: start; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; border: 1px solid rgba(70,48,36,0.11); background: #fbf7f0; box-shadow: 0 30px 60px -50px rgba(70,48,36,0.5); transition: transform 0.45s cubic-bezier(.2,.8,.2,1);\">\n          <div style=\"position: relative; aspect-ratio: 4 / 3;\">\n            <image-slot id=\"proj-paper\" shape=\"rect\" placeholder=\"Drop an image from the paper\" src=\"691432b7-3397-45a0-ab92-f0ae356670a4\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"padding: 26px 26px 28px; display: flex; flex-direction: column; flex: 1;\">\n            <div style=\"display: flex; justify- nt-size: 14px; line-height: 1.62; color: #5a4c42;\">Demonstrated priority inversion between safety, planning and logging threads, then resolved it with priority inheritance and a priority-ceiling protocol.<\u002Fp>\n            <div style=\"margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px;\">\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Java<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Multithreading<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Scheduling<\u002Fspan>\n            <\u002Fdiv>\n            <a href=\"https://github.com/ananya-520/Real-Time-Robotic-Arm-Controller\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(70,48,36,0.12); font-size: 13.5px; font-weight: 600; color: #8c0a28; transition: color 0.25s, padding 0.25s;\" style-hover=\"color: #a30d2f; padding-left: 4px;\"><span>View project<\u002Fspan><span>↗<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article data-card=\"\" style=\"flex: 0 0 min(340px, 82vw); scroll-snap-align: start; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; border: 1px solid rgba(70,48,36,0.11); background: #fbf7f0; box-shadow: 0 30px 60px -50px rgba(70,48,36,0.5); transition: transform 0.45s cubic-bezier(.2,.8,.2,1);\">\n          <div style=\"position: relative; aspect-ratio: 4 / 3;\">\n            <image-slot id=\"proj-maze\" shape=\"rect\" placeholder=\"Drop an image of the maze robot\" src=\"cab7fa93-d4b4-4eae-b117-c5914359c9ba\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"padding: 26px 26px 28px; display: flex; flex-direction: column; flex: 1;\">\n            <div style=\"display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;\"><span style=\"color: #8c0a28;\">Mobile robotics<\u002Fspan><span style=\"color: #7a6b5f;\">CSCI291<\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin: 0 0 10px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #2a211c;\">Autonomous Maze Navigation<\u002Fh3>\n            <p style=\"margin: 0 0 20px; font-size: 14px; line-height: 1.62; color: #5a4c42;\">An e-puck robot in Webots that follows the left wall using 8 distance sensors, logs light and GPS readings at dead-ends, then returns to the brightest one within 0.07 units.<\u002Fp>\n            <div style=\"margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px;\">\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">C<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Webots<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">e-puck<\u002Fspan>\n            <\u002Fdiv>\n            <a href=\"https://github.com/ananya-520/Webots-Robots-Simulation\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(70,48,36,0.12); font-size: 13.5px; font-weight: 600; color: #8c0a28; transition: color 0.25s, padding 0.25s;\" style-hover=\"color: #a30d2f; padding-left: 4px;\"><span>View project<\u002Fspan><span>↗<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article data-card=\"\" style=\"flex: 0 0 min(340px, 82vw); scroll-snap-align: start; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; border: 1px solid rgba(70,48,36,0.11); background: #fbf7f0; box-shadow: 0 30px 60px -50px rgba(70,48,36,0.5); transition: transform 0.45s cubic-bezier(.2,.8,.2,1);\">\n          <div style=\"position: relative; aspect-ratio: 4 / 3;\">\n            <image-slot id=\"proj-silahgrid\" shape=\"rect\" placeholder=\"Drop an image of SilahGrid\" src=\"be2de11b-4eb5-467f-9135-292453506548\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"padding: 26px 26px 28px; display: flex; flex-direction: column; flex: 1;\">\n            <div style=\"display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;\"><span style=\"color: #8c0a28;\">Edge computing<\u002Fspan><span style=\"color: #7a6b5f;\">Academic<\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin: 0 0 10px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #2a211c;\">SilahGrid: Solar Edge Data Pods<\u002Fh3>\n            <p style=\"margin: 0 0 20px; font-size: 14px; line-height: 1.62; color: #5a4c42;\">A simulation of 10 solar-powered edge pods across Dubai, modelling battery, cooling and task queues, with RandomForest models routing work between pods and a data centre.<\u002Fp>\n            <div style=\"margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px;\">\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Streamlit<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-radius: 999px; font-size: 12px; color: #43372f; background: rgba(70,48,36,0.06);\">Plotly<\u002Fspan>\n              <span style=\"padding: 5px 11px; border-r et.closest && e.target.closest('a, button, [data-card], robot-bust, image-slot');\n        const big = !!hot;\n        ring.style.width = ring.style.height = big ? '58px' : '36px';\n        ring.style.margin = big ? '-29px 0 0 -29px' : '-18px 0 0 -18px';\n        ring.style.background = big ? 'rgba(140,10,40,0.06)' : 'transparent';\n      };\n      this._cl = () => { ring.style.opacity = '0'; dot.style.opacity = '0'; };\n      window.addEventListener('pointermove', this._cm, { passive: true });\n      document.addEventListener('pointerleave', this._cl);\n    }\n\n    const marquee = root.querySelector('[data-marquee]');\n    const floats = Array.from(root.querySelectorAll('[data-float]'));\n    const progress = root.querySelector('[data-progress]');\n    let mx = 0, lastSt = 0, boost = 0, t0 = performance.now();\n\n    const parallax = Array.from(root.querySelectorAll('[data-card] image-slot, #about image-slot#portrait'));\n    parallax.forEach((el) => { el.style.willChange = 'transform'; el.style.transformOrigin = 'center'; });\n\n    const header = root.querySelector('[data-nav]');\n    const orbit = root.querySelector('[data-orbit]');\n    const nodes = Array.from(root.querySelectorAll('[data-node]'));\n    const secs = Array.from(root.querySelectorAll('section[data-sec]'));\n    let last = '';\n\n    cards.forEach((el) => {\n      el.addEventListener('pointermove', (e) => {\n        const r = el.getBoundingClientRect();\n        const x = (e.clientX - r.left) / r.width - 0.5;\n        const y = (e.clientY - r.top) / r.height - 0.5;\n        const m = M();\n        el.style.transform = 'perspective(1400px) rotateY(' + (x * 1.6 * m).toFixed(2) + 'deg) rotateX(' + (-y * 1.3 * m).toFixed(2) + 'deg) translateY(-4px)';\n      });\n      el.addEventListener('pointerleave', () => { el.style.transform = ''; });\n    });\n\n    const tick = () => {\n      this._raf = requestAnimationFrame(tick);\n      const vh = root.clientHeight;\n      if (!vh) return;\n      const st = root.scrollTop;\n      const m = M();\n\n      if (header) {\n        const on = st > 24;\n        header.style.background = on ? 'rgba(243,236,225,0.88)' : 'transparent';\n        header.style.backdropFilter = on ? 'blur(18px)' : 'none';\n        header.style.borderBottomColor = on ? 'rgba(70,48,36,0.1)' : 'transparent';\n      }\n      if (orbit) {\n        const hero = root.querySelector('#home');\n        const span = Math.max(vh * 0.8, hero ? hero.offsetHeight * 0.9 : vh);\n        const p = Math.min(1, st / span);\n        orbit.style.transform = 'translateY(' + (-p * 40 * m).toFixed(1) + 'px) scale(' + (1 - p * 0.05).toFixed(3) + ')';\n      }\n\n      const now = (performance.now() - t0) / 1000;\n      boost = boost * 0.92 + Math.abs(st - lastSt) * 0.08;\n      lastSt = st;\n      if (marquee) {\n        const half = marquee.scrollWidth / 2;\n        mx -= (0.6 + Math.min(8, boost * 0.5)) * (0.4 + m * 0.6);\n        if (half && -mx >= half) mx += half;\n        marquee.style.transform = 'translate3d(' + mx.toFixed(1) + 'px,0,0)';\n      }\n      floats.forEach((el, i) => {\n        el.style.transform = 'translateY(' + (Math.sin(now * 1.1 + i * 1.7) * 6 * m).toFixed(1) + 'px)';\n      });\n      if (progress) progress.style.transform = 'scaleX(' + (st / Math.max(1, root.scrollHeight - vh)).toFixed(4) + ')';\n      if (ring && dot && fine) {\n        cur.rx += (cur.x - cur.rx) * 0.18; cur.ry += (cur.y - cur.ry) * 0.18;\n        ring.style.transform = 'translate3d(' + cur.rx.toFixed(1) + 'px,' + cur.ry.toFixed(1) + 'px,0)';\n        dot.style.transform = 'translate3d(' + cur.x + 'px,' + cur.y + 'px,0)';\n      }\n\n      parallax.forEach((el) => {\n        const r = el.parentElement.getBoundingClientRect();\n        if (r.bottom < -50 || r.top > vh + 50) return;\n        const off = ((r.top + r.height / 2) - vh / 2) / vh;\n        el.style.transform = 'translateY(' + (off * -26 * m).toFixed(1) + 'px) scale(1.1)';\n      });\n\n      const prog = st / Math.max(1, root.scrollHeight - vh);\n      const rb = root.querySelector('robot-bust');\n      if (rb && rb.setScroll) rb.setScroll(Math.min(1, st / Math.max(1, vh)) * 0.2);\n      const bg = root.querySelector('depth-field');\n      if (bg && bg.setScroll) bg.setScroll(prog);\n\n      let act = secs[0];\n      secs.forEach((s) => { if (s.getBoundingClientRect().top <= vh * 0.4) act = s; });\n      const id = act && act.dataset.sec;\n      if (id && id !== last) {\n        last = id;\n        document.dispatchEvent(new CustomEvent('robot:nod'));\n        nodes.forEach((a) => {\n          const on = a.dataset.node === id;\n          const label = a.firstElementChild;\n          const line = a.lastElementChild;\n          label.style.opacity = on ? '1' : '0';\n          label.style.color = on ? '#2a211c' : '#8a7b6e';\n          line.style.width = on ? '32px' : '16px';\n          line.style.background = on ? '#8c0a28' : '#d3c6b4';\n        });\n        root.querySelectorAll('nav [data-goto]:not([data-goto=\"contact\"])').forEach((a) => {\n          a.style.color = a.dataset.goto === id ? '#2a211c' : '#6b5d52';\n        });\n      }\n    };\n    tick();\n  }\n\n  componentDidUpdate() {\n    const root = this.rootRef.current;\n    const rb = root && root.querySelector('robot-bust');\n    if (!rb) return;\n    rb.setAttribute('accent', this.props.accent ?? '#8c0a28');\n    rb.setAttribute('motion', String(this.props.motion ?? 7));\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    this._io && this._io.disconnect();\n    this._lio && this._lio.disconnect();\n    this._cio && this._cio.disconnect();\n    clearInterval(this._rotT);\n    if (this._cm) window.removeEventListener('pointermove', this._cm);\n    if (this._cl) document.removeEventListener('pointerleave', this._cl);\n    const root = this.rootRef.current;\n    if (root && this._nav) root.removeEventListener('click', this._nav);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
